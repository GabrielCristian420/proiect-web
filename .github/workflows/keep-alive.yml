name: Keep Alive Render Service

on:
  schedule:
    # Runs every 14 minutes to prevent Render free-tier hibernation (15-minute idle limit)
    - cron: '*/14 * * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Ping Healthcheck
    runs-on: ubuntu-latest
    steps:
      - name: Send keep-alive ping
        env:
          RENDER_URL: ${{ secrets.RENDER_SERVICE_URL }}
        run: |
          BASE_URL="${RENDER_URL:-https://proiect-web.onrender.com}"
          BASE_URL="${BASE_URL%/}"
          TARGET_URL="${BASE_URL}/ping"
          echo "Pinging healthcheck at: $TARGET_URL"
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "$TARGET_URL" || true)
          echo "HTTP Response Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "Service is awake and healthy!"
          else
            echo "Notice: Endpoint returned HTTP $HTTP_STATUS (service might be waking up)"
          fi

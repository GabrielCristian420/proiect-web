{% extends "layout.html" %}
{% block main %}

<div class="form-card form-card-md">
    <h2>Apartament Nou</h2>
    <p class="sub">Adauga o unitate noua in portofoliu.</p>
    <hr class="form-divider">

    <form action="/apartments/add" method="post">
        <div class="form-group">
            <label class="form-label">Numar / unitate *</label>
            <input class="form-control" name="number" placeholder="ex: 304, A12, Garsoniera 2" required>
        </div>

        <div class="form-group">
            <label class="form-label">Adresa *</label>
            <input class="form-control" name="address" placeholder="ex: Strada Exemplu 10, Bucuresti" required>
        </div>

        <hr class="form-divider">

        <div class="form-actions-row">
            <a href="/" class="btn btn-ghost">Anuleaza</a>
            <button type="submit" class="btn btn-gold">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
                Adauga apartament
            </button>
        </div>
    </form>
</div>

{% endblock %}

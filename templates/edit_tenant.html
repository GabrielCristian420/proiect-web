<!-- Pagina editare chirias: modifica datele unui chirias existent -->
{% extends "layout.html" %}
{% block main %}

<div class="form-card form-card-md">
    <h2>Editeaza Chirias</h2>
    <p class="sub">Modifica datele pentru {{ tenant.first_name }} {{ tenant.last_name }} — Unitatea {{ tenant.number }}.</p>
    <hr class="form-divider">

    <!-- Formular editare: campuri pre-completate cu datele chiriasului -->
    <form action="/edit_tenant/{{ tenant.id }}" method="post">
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Prenume *</label>
                <input class="form-control" name="first_name" value="{{ tenant.first_name }}" required>
            </div>
            <div class="form-group">
                <label class="form-label">Nume *</label>
                <input class="form-control" name="last_name" value="{{ tenant.last_name }}" required>
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Adresa Email *</label>
            <input class="form-control" name="email" type="email" value="{{ tenant.email }}" required>
        </div>
        <div class="form-group">
            <label class="form-label">Numar Telefon</label>
            <input class="form-control" name="phone" type="tel" value="{{ tenant.phone or '' }}">
        </div>
        <div class="form-group">
            <label class="form-label">Unitate</label>
            <div class="select-wrap">
                <select class="form-select" name="apartment_id">
                    <!-- Loop: afiseaza unitatile disponibile + unitatea curenta -->
                    {% for apt in available_apts %}
                        <option value="{{ apt.id }}" {% if apt.id == tenant.apartment_id %}selected{% endif %}>
                            Unitate {{ apt.number }} — {{ apt.address }}
                            {% if apt.id == tenant.apartment_id %}(actuala){% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <hr class="form-divider">
        <!-- Sectiune contract: date inceput/sfarsit si chirie lunara -->
        <div class="form-row">
            <div class="form-group">
                <label class="form-label">Inceput Contract</label>
                <input class="form-control" name="contract_start" type="date" value="{{ tenant.contract_start or '' }}">
            </div>
            <div class="form-group">
                <label class="form-label">Sfarsit Contract</label>
                <input class="form-control" name="contract_end" type="date" value="{{ tenant.contract_end or '' }}">
            </div>
        </div>
        <div class="form-group">
            <label class="form-label">Chirie Lunara (RON)</label>
            <input class="form-control" name="rent_amount" type="number" step="0.01" min="0" value="{{ tenant.rent_amount or '' }}" placeholder="ex: 1500">
        </div>
        <hr class="form-divider">
        <button type="submit" class="btn btn-gold btn-full">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="15" height="15"><polyline points="20 6 9 17 4 12"/></svg>
            Salveaza Modificarile
        </button>
    </form>
</div>

{% endblock %}
